<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>quiz.host — live monitor</title>
<link rel="stylesheet" href="style.css">
<style>
  .layout{ display:grid; grid-template-columns: 1fr 320px; min-height: 600px; }
  .main{ padding: 30px 34px 36px; }
  .side{ background: var(--panel-3); border-left:1px solid var(--border); padding: 26px 22px; display:flex; flex-direction:column; gap:22px; }

  .room-hero{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:16px; margin-bottom:22px; }
  .room-hero .code{ font-family: var(--mono); font-size:34px; letter-spacing:9px; color: var(--teal); }
  .room-hero .label{ font-family: var(--mono); font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.1em; }

  .qbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .qbar .qnum{ font-family: var(--mono); font-size:14px; color: var(--amber); }
  .progress-track{ height:6px; background: var(--panel-3); border:1px solid var(--border); border-radius:4px; overflow:hidden; margin-bottom:22px; }
  .progress-fill{ height:100%; background: var(--amber); width:0%; transition: width .3s ease; }

  .current-q{ background: var(--panel-3); border:1px solid var(--border); border-radius:8px; padding:20px 22px; margin-bottom:22px; }
  .current-q h3{ font-family: var(--mono); font-size:15px; margin:0 0 14px; }
  .opt-list{ display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
  .opt-chip{ font-family: var(--mono); font-size:12.5px; padding:9px 12px; border:1px solid var(--border); border-radius:6px; color: var(--muted); }
  .opt-chip.correct{ border-color: var(--green); color: var(--green); }

  .participant-list{ display:flex; flex-direction:column; gap:8px; overflow-y:auto; max-height: 260px; }
  .p-row{ display:flex; align-items:center; justify-content:space-between; font-family: var(--mono); font-size:12.5px; padding:8px 10px; background: var(--panel-2); border:1px solid var(--border); border-radius:6px; }
  .p-row .p-name{ display:flex; align-items:center; gap:8px; }
  .p-row .p-dot{ width:6px; height:6px; border-radius:50%; background: var(--green); flex-shrink:0; }
  .p-row .p-score{ color: var(--amber); }
  .p-row .p-flag{ color: var(--red); font-size:11px; }

  .side-title{ font-family: var(--mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); display:flex; align-items:center; gap:8px; justify-content:space-between; }
  .side-title::before{ content:""; width:6px; height:6px; border-radius:50%; background:var(--teal); }
  .count-pill{ font-family: var(--mono); font-size:11px; background: var(--panel-2); border:1px solid var(--border); border-radius: 20px; padding:2px 9px; color: var(--text); }

  @media (max-width: 900px){
    .layout{ grid-template-columns: 1fr; }
    .side{ border-left:none; border-top:1px solid var(--border); }
    .opt-list{ grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="window">
  <div class="titlebar">
    <div class="dot r"></div><div class="dot y"></div><div class="dot g"></div>
    <div class="path"><a href="index.html">~/quiz-app</a> / host-live.session</div>
    <div class="badge teal" id="phase-badge">lobby</div>
  </div>

  <div class="layout">
    <div class="main">
      <div class="room-hero">
        <div>
          <div class="label">room code</div>
          <div class="code" id="room-code-display">------</div>
        </div>
        <div id="lobby-actions">
          <button class="btn btn-teal" id="launch-btn" type="button">launch_quiz --begin</button>
        </div>
        <div id="live-actions" style="display:none; gap:12px;" class="action-row">
          <button class="btn btn-amber" id="next-btn" type="button">next_question --advance</button>
          <button class="btn btn-ghost" id="end-btn" type="button">end_quiz --finish</button>
        </div>
      </div>

      <div id="lobby-panel" class="panel-card">
        <div class="panel-head">
          <div><h2><span class="idx">◐</span> Waiting for participants</h2><p>Share the room code above. The quiz begins when you click launch.</p></div>
        </div>
        <div class="empty-state" id="lobby-empty">No participants yet — waiting for people to join room <span id="lobby-code-inline"></span>...</div>
      </div>

      <div id="live-panel" style="display:none;">
        <div class="qbar"><span class="qnum" id="qnum-label">Question 1 of 5</span><span class="status-line" id="live-timer" style="margin:0;"></span></div>
        <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
        <div class="current-q">
          <h3 id="current-q-text">—</h3>
          <div class="opt-list" id="current-q-options"></div>
        </div>
      </div>
    </div>

    <div class="side">
      <div class="side-title">participants <span class="count-pill" id="participant-count">0</span></div>
      <div class="participant-list" id="participant-list"></div>

      <div class="lock-banner" id="lock-banner"><span class="dot-pulse"></span><span>Anti-copy lock active — violations: <b id="violation-count">0</b></span></div>

      <div class="side-title">activity log</div>
      <div class="feed" id="feed-lines"></div>
    </div>
  </div>
</div>

<script src="common.js"></script>
<script>
  const roomCode = QuizApp.getParam('code', QuizApp.generateRoomCode());
  const timerSec = Number(QuizApp.getParam('timer', 30));
  const anticopy = QuizApp.getParam('anticopy', '1') === '1';
  const quizDataRaw = QuizApp.getParam('quiz', '');
  const questions = QuizApp.decodeQuiz(quizDataRaw) || QuizApp.sampleQuiz();

  document.getElementById('room-code-display').textContent = roomCode;
  document.getElementById('lobby-code-inline').textContent = roomCode;

  function log(html){
    const feed = document.getElementById('feed-lines');
    const div = document.createElement('div');
    div.className = 'feed-line';
    div.innerHTML = html;
    feed.appendChild(div);
  }
  log(`<span class="prompt">$</span> host-live --room ${roomCode}`);
  log(`<span class="comment">// ${questions.length} questions loaded, ${timerSec}s each</span>`);
  if(anticopy) log('<span class="comment">// anti-copy lock will apply to participants once quiz starts</span>');

  // ---------- simulated lobby: participants trickling in ----------
  const sampleNames = ['Aditi','Rohan','Priya','Karthik','Sneha','Arjun','Meera','Vikram','Divya','Sanjay'];
  let participants = [];
  let joinTimer = null;

  function renderParticipants(){
    const list = document.getElementById('participant-list');
    document.getElementById('participant-count').textContent = participants.length;
    document.getElementById('lobby-empty').style.display = participants.length ? 'none' : 'block';
    list.innerHTML = participants.map(p => `
      <div class="p-row">
        <span class="p-name"><span class="p-dot"></span>${p.name}</span>
        <span class="p-score">${p.score !== undefined ? p.score + ' pts' : 'joined'}</span>
      </div>`).join('');
  }

  function startLobbySimulation(){
    joinTimer = setInterval(() => {
      if(participants.length >= sampleNames.length) { clearInterval(joinTimer); return; }
      const name = sampleNames[participants.length];
      participants.push({ name, score: undefined });
      renderParticipants();
      log(`<span class="ok">✓</span> ${name} joined the room`);
    }, 1400);
  }
  startLobbySimulation();

  // ---------- launch quiz ----------
  let currentIndex = -1;
  let countdownInterval = null;

  document.getElementById('launch-btn').addEventListener('click', () => {
    clearInterval(joinTimer);
    if(participants.length === 0){
      participants.push({ name: 'Aditi', score: undefined }, { name: 'Rohan', score: undefined });
    }
    participants = participants.map(p => ({ ...p, score: 0 }));
    renderParticipants();

    document.getElementById('phase-badge').textContent = 'live';
    document.getElementById('lobby-panel').style.display = 'none';
    document.getElementById('live-panel').style.display = 'block';
    document.getElementById('lobby-actions').style.display = 'none';
    document.getElementById('live-actions').style.display = 'flex';

    log('<span class="ok">✓</span> quiz launched');
    if(anticopy){ antiCopy.engage(); }
    nextQuestion();
  });

  function updateProgress(){
    const pct = ((currentIndex + 1) / questions.length) * 100;
    document.getElementById('progress-fill').style.width = pct + '%';
    document.getElementById('qnum-label').textContent = `Question ${currentIndex + 1} of ${questions.length}`;
  }

  function renderCurrentQuestion(){
    const q = questions[currentIndex];
    document.getElementById('current-q-text').textContent = q.text;
    document.getElementById('current-q-options').innerHTML = q.options.map((opt, i) => `
      <div class="opt-chip ${i === Number(q.correct) ? 'correct' : ''}">${opt}${i === Number(q.correct) ? ' ✓' : ''}</div>
    `).join('');
  }

  function nextQuestion(){
    clearInterval(countdownInterval);
    currentIndex++;
    if(currentIndex >= questions.length){
      finishQuiz();
      return;
    }
    updateProgress();
    renderCurrentQuestion();
    log(`<span class="prompt">$</span> show_question --index ${currentIndex + 1}`);

    let remaining = timerSec;
    const timerEl = document.getElementById('live-timer');
    timerEl.textContent = `⏱ ${remaining}s`;
    countdownInterval = setInterval(() => {
      remaining--;
      timerEl.textContent = `⏱ ${Math.max(remaining,0)}s`;
      // simulate participants scoring while question is live
      if(remaining === Math.floor(timerSec/2)){
        participants = participants.map(p => Math.random() > 0.4 ? { ...p, score: p.score + Math.floor(Math.random()*80+20) } : p);
        renderParticipants();
      }
      if(remaining <= 0){
        clearInterval(countdownInterval);
        timerEl.textContent = 'time up';
      }
    }, 1000);
  }

  document.getElementById('next-btn').addEventListener('click', nextQuestion);

  function finishQuiz(){
    log('<span class="ok">✓</span> all questions complete');
    goToResults();
  }

  document.getElementById('end-btn').addEventListener('click', () => {
    clearInterval(countdownInterval);
    log('<span class="comment">// host ended the quiz early</span>');
    goToResults();
  });

  function goToResults(){
    if(antiCopy) antiCopy.disengage();
    const leaderboard = [...participants].sort((a,b) => (b.score||0) - (a.score||0))
      .map(p => `${p.name}:${p.score||0}`).join(',');
    setTimeout(() => {
      window.location.href = QuizApp.buildUrl('results.html', { role: 'host', code: roomCode, board: leaderboard });
    }, 400);
  }

  const antiCopy = initAntiCopyLock(log);
</script>
</body>
</html>
