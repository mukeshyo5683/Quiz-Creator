<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>quiz.auth — sign in</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  body{ display:flex; align-items:center; justify-content:center; padding: 24px; }
  .window{ max-width: 980px; margin:0; }
  .layout{ display:grid; grid-template-columns: 1.05fr 1fr; min-height: 560px; }

  .feed-panel{ background:#0a0d12; border-right:1px solid var(--border); padding:28px 30px; overflow:hidden; }
  .feed-title{ font-family: var(--mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:18px; display:flex; align-items:center; gap:8px; }
  .feed-title::before{ content:""; width:6px; height:6px; background:var(--amber); border-radius:50%; }

  .auth{ padding: 28px 34px 30px; display:flex; flex-direction:column; }
  .tabs{ display:flex; gap:2px; margin-bottom:26px; border-bottom:1px solid var(--border); }
  .tab{
    flex:1; background:transparent; border:none; border-bottom:2px solid transparent;
    color:var(--muted); font-family: var(--mono); font-size:13px; padding:11px 6px 13px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:8px; transition: color .15s ease, border-color .15s ease;
  }
  .tab .filedot{ width:6px; height:6px; border-radius:50%; background:var(--border); transition: background .15s ease; }
  .tab[data-role="host"].active{ color: var(--amber); border-color: var(--amber); }
  .tab[data-role="host"].active .filedot{ background: var(--amber); }
  .tab[data-role="participant"].active{ color: var(--teal); border-color: var(--teal); }
  .tab[data-role="participant"].active .filedot{ background: var(--teal); }
  .tab:not(.active):hover{ color: var(--text); }

  .heading{ font-family: var(--mono); font-size:20px; margin:0 0 4px; }
  .subheading{ color:var(--muted); font-size:13.5px; margin:0 0 26px; }

  form{ display:none; flex-direction:column; gap:16px; }
  form.active{ display:flex; }

  .field-wrap{ position:relative; }
  .field-wrap .prefix{ position:absolute; left:13px; top:50%; transform:translateY(-50%); font-family:var(--mono); color:var(--muted); font-size:14px; pointer-events:none; }
  .field-wrap input{ padding-left:26px; }

  .code-input{ letter-spacing:6px; font-size:18px; text-align:center; text-transform:uppercase; }

  .row-between{ display:flex; align-items:center; justify-content:space-between; font-size:12.5px; color:var(--muted); }
  .row-between a{ color:inherit; text-decoration:none; border-bottom:1px dashed var(--border); }
  .row-between a:hover{ color: var(--text); }

  .checkbox-row{ display:flex; align-items:center; gap:8px; }
  .checkbox-row input[type="checkbox"]{ width:14px; height:14px; padding:0; accent-color:var(--amber); }
  .checkbox-row label{ margin:0; font-size:12.5px; color:var(--muted); }

  button.submit{
    margin-top:4px; border:none; border-radius:6px; padding:12px 16px;
    font-family: var(--mono); font-size:14px; font-weight:600; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:8px;
    transition: transform .1s ease, filter .15s ease;
  }
  button.submit:active{ transform: scale(.98); }
  #host-form button.submit{ background: var(--amber); color:#241a08; }
  #host-form button.submit:hover{ filter: brightness(1.08); }
  #participant-form button.submit{ background: var(--teal); color:#06282a; }
  #participant-form button.submit:hover{ filter: brightness(1.08); }

  .switch-note{ text-align:center; font-size:12.5px; color:var(--muted); margin-top:4px; }
  .switch-note button{ background:none; border:none; padding:0; font-family:var(--mono); cursor:pointer; color:inherit; border-bottom:1px dashed var(--muted); }

  .google-btn{
    display:flex; align-items:center; justify-content:center; gap:10px;
    background: #fff; color: #1f1f1f; border:none; border-radius:6px;
    padding: 11px 16px; font-family: var(--sans); font-size:13.5px; font-weight:600;
    cursor:pointer; transition: filter .15s ease, transform .1s ease;
  }
  .google-btn:hover{ filter: brightness(0.96); }
  .google-btn:active{ transform: scale(.98); }
  .google-btn svg{ width:18px; height:18px; flex-shrink:0; }

  .or-divider{ display:flex; align-items:center; gap:10px; color: var(--muted); font-size:11px; font-family: var(--mono); margin: 2px 0; }
  .or-divider::before, .or-divider::after{ content:""; flex:1; height:1px; background: var(--border); }

  /* participant: google-first, then room details */
  #participant-step-google{ display:flex; flex-direction:column; gap:10px; }
  #participant-step-join{ display:none; flex-direction:column; gap:16px; }
  .signed-in-chip{
    display:flex; align-items:center; gap:10px;
    background: var(--panel-3); border:1px solid var(--border); border-radius:6px;
    padding:9px 12px; font-family: var(--mono); font-size:12px; color:var(--muted);
  }
  .signed-in-chip img{ width:22px; height:22px; border-radius:50%; flex-shrink:0; }
  .signed-in-chip b{ color: var(--text); }
  .signed-in-chip button{
    margin-left:auto; background:none; border:none; padding:0; color:var(--muted);
    font-family:var(--mono); font-size:11px; cursor:pointer; border-bottom:1px dashed var(--border);
  }
  .signed-in-chip button:hover{ color: var(--text); }

  @media (max-width: 760px){
    .layout{ grid-template-columns: 1fr; }
    .feed-panel{ display:none; }
  }
</style>
</head>
<body>

<div class="window">
  <div class="titlebar">
    <div class="dot r"></div><div class="dot y"></div><div class="dot g"></div>
    <div class="path">~/quiz-app/auth.session</div>
  </div>

  <div class="layout">
    <div class="feed-panel">
      <div class="feed-title">session log</div>
      <div id="feed-lines" class="feed"></div>
    </div>

    <div class="auth">
      <div class="tabs">
        <button class="tab active" data-role="host"><span class="filedot"></span>host.login</button>
        <button class="tab" data-role="participant"><span class="filedot"></span>participant.join</button>
      </div>

      <form id="host-form" class="active" autocomplete="off">
        <div>
          <h2 class="heading">Sign in to host</h2>
          <p class="subheading">Create quizzes, control sessions, view live results.</p>
        </div>

        <button type="button" class="google-btn" id="google-signin-btn">
          <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.9 32.9 29.4 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.5 5.1 29.5 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21 21-9.4 21-21c0-1.4-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.9 18.9 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34.5 5.1 29.5 3 24 3 16.3 3 9.7 7.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 45c5.3 0 10.1-2 13.7-5.4l-6.3-5.3C29.4 36 26.9 37 24 37c-5.3 0-9.8-3.1-11.3-7.5l-6.5 5C9.6 40.6 16.2 45 24 45z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-1 3-3 5.5-5.6 7.1l6.3 5.3C39.9 37.6 43 31.6 43 24c0-1.4-.1-2.4-.4-3.5z"/></svg>
          Continue with Google
        </button>

        <div class="or-divider">or sign in with email</div>

        <div>
          <label for="host-email">email <span style="color:var(--red)">*</span></label>
          <div class="field-wrap"><span class="prefix">&gt;</span><input id="host-email" type="email" placeholder="you@example.com" required></div>
        </div>
        <div>
          <label for="host-password">password <span style="color:var(--red)">*</span></label>
          <div class="field-wrap"><span class="prefix">&gt;</span><input id="host-password" type="password" placeholder="••••••••" required minlength="6"></div>
        </div>
        <div class="row-between">
          <div class="checkbox-row"><input type="checkbox" id="host-remember"><label for="host-remember">keep me signed in</label></div>
          <a href="#">forgot password?</a>
        </div>
        <button type="submit" class="submit">host_login --run</button>
        <div class="status-line" id="host-status"></div>
        <p class="switch-note">no account? <button type="button" class="link-to-google-signup">create a new account</button></p>
      </form>

      <form id="participant-form" autocomplete="off">
        <div>
          <h2 class="heading">Join a quiz</h2>
          <p class="subheading">Sign in with Google, then enter your host's room code.</p>
        </div>

        <div id="participant-step-google">
          <button type="button" class="google-btn" id="participant-google-btn">
            <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.9 32.9 29.4 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.5 5.1 29.5 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21 21-9.4 21-21c0-1.4-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.9 18.9 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34.5 5.1 29.5 3 24 3 16.3 3 9.7 7.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 45c5.3 0 10.1-2 13.7-5.4l-6.3-5.3C29.4 36 26.9 37 24 37c-5.3 0-9.8-3.1-11.3-7.5l-6.5 5C9.6 40.6 16.2 45 24 45z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-1 3-3 5.5-5.6 7.1l6.3 5.3C39.9 37.6 43 31.6 43 24c0-1.4-.1-2.4-.4-3.5z"/></svg>
            Continue with Google
          </button>
          <div class="status-line" id="participant-google-status"></div>
        </div>

        <div id="participant-step-join">
          <div class="signed-in-chip" id="participant-chip"></div>
          <div>
            <label for="p-name">display name <span style="color:var(--red)">*</span></label>
            <div class="field-wrap"><span class="prefix">&gt;</span><input id="p-name" type="text" placeholder="e.g. Mukesh" required maxlength="24"></div>
          </div>
          <div>
            <label for="p-code">room code <span style="color:var(--red)">*</span></label>
            <input id="p-code" class="code-input" type="text" placeholder="A1B2C3" required maxlength="6">
          </div>
          <div>
            <label for="p-password">room password <span style="color:var(--muted)">(if set)</span></label>
            <div class="field-wrap"><span class="prefix">&gt;</span><input id="p-password" type="password" placeholder="optional"></div>
          </div>
          <button type="submit" class="submit">join_quiz --run</button>
          <div class="status-line" id="participant-status"></div>
        </div>

        <p class="switch-note">hosting a quiz? <button type="button" data-role="host" class="link-to-host">sign in as host instead</button></p>
      </form>
    </div>
  </div>
</div>

<script src="assets/common.js"></script>
<script type="module">
  import { getRoom, addParticipant } from "./assets/rooms.js";
  import { signInWithGoogle, signOutUser, watchAuthState } from "./assets/auth.js";

  const tabs = document.querySelectorAll('.tab');
  const forms = { host: document.getElementById('host-form'), participant: document.getElementById('participant-form') };
  function activateRole(role){
    tabs.forEach(t => t.classList.toggle('active', t.dataset.role === role));
    forms.host.classList.toggle('active', role === 'host');
    forms.participant.classList.toggle('active', role === 'participant');
  }
  tabs.forEach(tab => tab.addEventListener('click', () => activateRole(tab.dataset.role)));
  document.querySelectorAll('.link-to-host').forEach(b => b.addEventListener('click', () => activateRole('host')));
  // "no account? create a new account" — Google sign-in doubles as sign-up,
  // so this just triggers the same Google flow instead of switching tabs.
  document.querySelectorAll('.link-to-google-signup').forEach(b => b.addEventListener('click', () => {
    document.getElementById('google-signin-btn').click();
  }));

  // pre-select a tab if arriving with ?role=participant (e.g. shared join link)
  const initialRole = QuizApp.getParam('role', '');
  if(initialRole === 'participant') activateRole('participant');
  const prefillCode = QuizApp.getParam('code', '');
  if(prefillCode) document.getElementById('p-code').value = prefillCode.toUpperCase();

  document.getElementById('google-signin-btn').addEventListener('click', async () => {
    const status = document.getElementById('host-status');
    const btn = document.getElementById('google-signin-btn');
    btn.disabled = true;
    status.textContent = '> opening Google sign-in...';
    status.className = 'status-line';
    try{
      const user = await signInWithGoogle();
      status.textContent = `✓ signed in as ${user.email} — redirecting...`;
      status.className = 'status-line ok';
      window.location.href = QuizApp.buildUrl('create-quiz.html', { host: user.email });
    }catch(err){
      console.error(err);
      status.textContent = '✗ Google sign-in failed or was cancelled';
      status.className = 'status-line err';
    }finally{
      btn.disabled = false;
    }
  });

  // ---------- participant: Google sign-in step ----------
  let participantUser = null;

  function showParticipantJoinStep(user){
    participantUser = user;
    document.getElementById('participant-step-google').style.display = 'none';
    document.getElementById('participant-step-join').style.display = 'flex';
    document.getElementById('participant-chip').innerHTML = `
      <img src="${user.photoURL || ''}" alt="">
      <span>signed in as <b>${user.displayName || user.email}</b></span>
      <button type="button" id="participant-switch-account">switch account</button>
    `;
    if(!document.getElementById('p-name').value) document.getElementById('p-name').value = user.displayName || '';
  }

  function showParticipantGoogleStep(){
    participantUser = null;
    document.getElementById('participant-step-join').style.display = 'none';
    document.getElementById('participant-step-google').style.display = 'flex';
  }

  // handles the "switch account" button even though it's re-created each time
  document.getElementById('participant-chip').addEventListener('click', async (e) => {
    if(e.target.id !== 'participant-switch-account') return;
    await signOutUser();
    showParticipantGoogleStep();
  });

  document.getElementById('participant-google-btn').addEventListener('click', async () => {
    const status = document.getElementById('participant-google-status');
    const btn = document.getElementById('participant-google-btn');
    btn.disabled = true;
    status.textContent = '> opening Google sign-in...';
    status.className = 'status-line';
    try{
      const user = await signInWithGoogle();
      status.textContent = '';
      showParticipantJoinStep(user);
    }catch(err){
      console.error(err);
      status.textContent = '✗ Google sign-in failed or was cancelled';
      status.className = 'status-line err';
    }finally{
      btn.disabled = false;
    }
  });

  // if someone's already signed in (e.g. same browser used to host before,
  // or came back after joining once) skip straight to the join fields
  watchAuthState((user) => {
    if(user) showParticipantJoinStep(user);
    else showParticipantGoogleStep();
  });

  document.getElementById('host-form').addEventListener('submit', function(e){
    e.preventDefault();
    const status = document.getElementById('host-status');
    const email = document.getElementById('host-email').value.trim();
    const pass = document.getElementById('host-password').value;
    if(!email || pass.length < 6){
      status.textContent = '✗ error: valid email and 6+ char password required';
      status.className = 'status-line err';
      return;
    }
    status.textContent = '> authenticating ' + email + ' ...';
    status.className = 'status-line';
    setTimeout(() => {
      status.textContent = '✓ signed in — redirecting to host dashboard';
      status.className = 'status-line ok';
      window.location.href = QuizApp.buildUrl('create-quiz.html', { host: email });
    }, 500);
  });

  document.getElementById('participant-form').addEventListener('submit', async function(e){
    e.preventDefault();
    const status = document.getElementById('participant-status');

    if(!participantUser){
      status.textContent = '✗ error: please sign in with Google first';
      status.className = 'status-line err';
      return;
    }

    const name = document.getElementById('p-name').value.trim();
    const code = document.getElementById('p-code').value.trim().toUpperCase();
    const pw = document.getElementById('p-password').value;

    if(!name || code.length < 4){
      status.textContent = '✗ error: name and a valid room code are required';
      status.className = 'status-line err';
      return;
    }

    status.textContent = '> looking up room ' + code + ' ...';
    status.className = 'status-line';

    try{
      const room = await getRoom(code);
      if(!room){
        status.textContent = '✗ error: no room found with that code';
        status.className = 'status-line err';
        return;
      }
      if(room.passwordRequired && room.password !== pw){
        status.textContent = '✗ error: incorrect room password';
        status.className = 'status-line err';
        return;
      }
      if(room.status !== 'lobby' && !room.allowLateJoin){
        status.textContent = '✗ error: this quiz has already started';
        status.className = 'status-line err';
        return;
      }
      await addParticipant(code, participantUser.uid, name);
      status.textContent = '✓ joined — entering waiting room';
      status.className = 'status-line ok';
      window.location.href = QuizApp.buildUrl('waiting-room.html', { name, code });
    }catch(err){
      console.error(err);
      status.textContent = '✗ error: could not reach the server — check assets/firebase-config.js is filled in';
      status.className = 'status-line err';
    }
  });

  document.getElementById('p-code').addEventListener('input', e => e.target.value = e.target.value.toUpperCase());

  const lines = [
    { html: '<span class="prompt">$</span> quiz status' },
    { html: '<span class="comment">// 2 roles can authenticate here</span>' },
    { html: '<span class="ok">✓</span> host    → create + control quizzes' },
    { html: '<span class="ok">✓</span> participant → join with a room code' },
    { html: '' },
    { html: '<span class="prompt">$</span> _<span class="caret"></span>' },
  ];
  const feedEl = document.getElementById('feed-lines');
  let i = 0;
  function typeNext(){
    if(i >= lines.length) return;
    const div = document.createElement('div');
    div.className = 'feed-line';
    div.innerHTML = lines[i].html || '&nbsp;';
    feedEl.appendChild(div);
    i++;
    setTimeout(typeNext, 340);
  }
  typeNext();
</script>
</body>
</html>
