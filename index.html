<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OS Quiz — Process Scheduler</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap');

:root{
  --bg: #10121c;
  --panel: #181b2a;
  --panel-2: #1f2333;
  --line: #2b2f45;
  --text: #e9e7e0;
  --muted: #8b8fa8;
  --amber: #ffab4a;
  --blue: #6ea8fe;
  --green: #4fd88a;
  --red: #ff6b6b;
  --mono: 'JetBrains Mono', monospace;
  --sans: 'Inter', sans-serif;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:
    radial-gradient(ellipse at top left, #1a1f33 0%, transparent 55%),
    radial-gradient(ellipse at bottom right, #1a1830 0%, transparent 55%),
    var(--bg);
  color:var(--text);
  font-family:var(--sans);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}
.crt-noise{
  position:fixed; inset:0; pointer-events:none; opacity:0.03; z-index:0;
  background-image: repeating-linear-gradient(0deg, #fff 0px, transparent 1px, transparent 2px);
}
#app{ position:relative; z-index:1; width:100%; max-width:640px; }

.window{
  position:relative;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:10px;
  overflow:hidden;
  box-shadow: 0 30px 80px -20px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.02);
}

.titlebar{
  display:flex; align-items:center; gap:10px;
  padding:11px 16px;
  background:var(--panel-2);
  border-bottom:1px solid var(--line);
  font-family:var(--mono);
  font-size:12px;
  color:var(--muted);
}
.dots{ display:flex; gap:6px; }
.dot{ width:9px; height:9px; border-radius:50%; background:var(--line); transition:background .3s; }
.dot.on-register{ background:var(--muted); }
.dot.on-ready{ background:var(--blue); }
.dot.on-running{ background:var(--amber); animation:pulse 1.4s ease-in-out infinite; }
.dot.on-done{ background:var(--green); }
@keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.35;} }
.titletext{ flex:1; text-align:left; letter-spacing:.02em; }
.statebadge{
  font-family:var(--mono); font-size:10.5px; padding:3px 8px; border-radius:20px;
  border:1px solid var(--line); color:var(--muted); text-transform:uppercase; letter-spacing:.08em;
}

.body{ padding:32px; }

.eyebrow{
  font-family:var(--mono); font-size:11.5px; color:var(--amber);
  text-transform:uppercase; letter-spacing:.14em; margin:0 0 10px 0;
}
h1{
  font-family:var(--sans); font-weight:800; font-size:26px; line-height:1.2;
  margin:0 0 10px 0; letter-spacing:-0.01em;
}
p.lead{ color:var(--muted); font-size:14.5px; line-height:1.6; margin:0 0 26px 0; }

.btn{
  appearance:none; border:none; cursor:pointer;
  font-family:var(--sans); font-weight:700; font-size:14.5px;
  padding:14px 22px; border-radius:8px;
  background:var(--amber); color:#1a1200;
  transition:transform .12s, opacity .12s;
  width:100%;
}
.btn:hover{ transform:translateY(-1px); }
.btn:active{ transform:translateY(0); }
.btn:disabled{ opacity:.4; cursor:not-allowed; transform:none; }
.btn.secondary{ background:transparent; color:var(--text); border:1px solid var(--line); }
.btn.google{
  display:flex; align-items:center; justify-content:center; gap:10px;
  background:#fff; color:#1f1f1f;
}
.btn.google svg{ width:18px; height:18px; }

.pcb{
  font-family:var(--mono); font-size:12px; color:var(--muted);
  background:var(--panel-2); border:1px solid var(--line); border-radius:8px;
  padding:14px 16px; margin-top:22px;
  display:grid; grid-template-columns:1fr 1fr; gap:8px 18px;
}
.pcb div span.k{ display:block; color:var(--muted); font-size:10px; text-transform:uppercase; letter-spacing:.08em; }
.pcb div span.v{ display:block; color:var(--text); font-size:13px; margin-top:2px; word-break:break-word; }

.progresswrap{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; font-family:var(--mono); font-size:12px; color:var(--muted); }
.progressbar{ height:4px; background:var(--panel-2); border-radius:4px; overflow:hidden; margin-bottom:22px; }
.progressbar > div{ height:100%; background:linear-gradient(90deg, var(--blue), var(--amber)); transition:width .3s; }

.timerbox{
  display:flex; align-items:center; justify-content:center; gap:10px;
  font-family:var(--mono); font-weight:700; font-size:15px;
  padding:10px 14px; border-radius:8px; margin-bottom:24px;
  border:1px solid var(--line); background:var(--panel-2); color:var(--blue);
  transition:color .3s, border-color .3s;
}
.timerbox.warn{ color:var(--amber); border-color:rgba(255,171,74,0.4); }
.timerbox.critical{ color:var(--red); border-color:rgba(255,107,107,0.5); animation:pulse .8s ease-in-out infinite; }

.section-tag{ font-family:var(--mono); font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.1em; margin-bottom:8px; }
.qtext{ font-size:18px; font-weight:600; line-height:1.45; margin:0 0 22px 0; user-select:none; }

.options{ display:flex; flex-direction:column; gap:10px; margin-bottom:24px; user-select:none; }
.opt{
  text-align:left; background:var(--panel-2); border:1px solid var(--line); color:var(--text);
  border-radius:8px; padding:14px 16px; cursor:pointer; font-family:var(--sans); font-size:14.5px;
  display:flex; align-items:center; gap:12px; transition:border-color .15s, background .15s;
}
.opt:hover{ border-color:var(--blue); }
.opt.selected{ border-color:var(--amber); background:rgba(255,171,74,0.08); }
.opt .letter{
  font-family:var(--mono); font-weight:700; font-size:12px; color:var(--muted);
  width:22px; height:22px; border-radius:5px; border:1px solid var(--line);
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.opt.selected .letter{ color:var(--amber); border-color:var(--amber); }

table{ width:100%; border-collapse:collapse; font-family:var(--mono); font-size:13px; margin-top:6px; }
th{ text-align:left; color:var(--muted); font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; padding:8px 10px; border-bottom:1px solid var(--line); }
td{ padding:10px; border-bottom:1px solid var(--line); }
tr.me{ background:rgba(110,168,254,0.08); }
tr.top1 .rank{ color:var(--amber); }
.rank{ font-weight:700; }
.flag{ color:var(--red); font-size:11px; }
.footer-note{ font-size:12px; color:var(--muted); margin-top:22px; text-align:center; font-family:var(--mono); }
.spin{ display:inline-block; width:14px; height:14px; border:2px solid var(--line); border-top-color:var(--amber); border-radius:50%; animation:spin .7s linear infinite; vertical-align:-2px; margin-right:8px; }
@keyframes spin{ to{ transform:rotate(360deg); } }

.myresult{
  display:flex; justify-content:space-between; align-items:center;
  background:var(--panel-2); border:1px solid var(--line); border-radius:8px; padding:16px 18px; margin-bottom:22px;
}
.myresult .big{ font-family:var(--mono); font-weight:700; font-size:28px; color:var(--amber); }
.myresult .lbl{ font-family:var(--mono); font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; }

.errbox{
  background:rgba(255,107,107,0.08); border:1px solid rgba(255,107,107,0.35); color:var(--red);
  border-radius:8px; padding:12px 14px; font-size:13px; margin-bottom:18px; font-family:var(--mono);
}

@media (max-width:480px){
  .body{ padding:22px; }
  h1{ font-size:22px; }
  .pcb{ grid-template-columns:1fr; }
}

.fs-warning{
  position:fixed; inset:0; z-index:999;
  background:rgba(8,9,15,0.94);
  display:none; align-items:center; justify-content:center;
  padding:24px;
}
.fs-warning-box{
  max-width:420px; text-align:center;
  background:var(--panel); border:1px solid var(--line); border-radius:10px;
  padding:32px 28px;
  box-shadow: 0 30px 80px -20px rgba(0,0,0,0.7);
}
</style>
</head>
<body>
<div class="crt-noise"></div>
<div id="app"></div>
<div id="fsWarning" class="fs-warning" style="display:none;">
  <div class="fs-warning-box">
    <div class="eyebrow" style="margin-bottom:8px;">Fullscreen Required</div>
    <p style="margin:0 0 20px 0; color:var(--muted); font-size:14.5px; line-height:1.6;">
      You've exited fullscreen mode. The quiz must stay in fullscreen — your timer is still running.
    </p>
    <button class="btn" id="fsResumeBtn">Resume Fullscreen</button>
  </div>
</div>

<script type="module">
/* =========================================================================
   Firebase setup — must be loaded from a real https:// page (your GitHub
   Pages URL). Will NOT work by double-clicking the file locally.
   ========================================================================= */
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, query, where, limit } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";
import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCxhSRTBFU6eBJcmgpm819UHdJ7Crfk8VU",
  authDomain: "os-quizzy-eda4e.firebaseapp.com",
  projectId: "os-quizzy-eda4e",
  storageBucket: "os-quizzy-eda4e.firebasestorage.app",
  messagingSenderId: "686176764845",
  appId: "1:686176764845:web:c6b0a1a5c8072255691724"
};
const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);
const auth = getAuth(fbApp);
const googleProvider = new GoogleAuthProvider();
const resultsCollectionRef = collection(db, 'os_quiz_results');

/* ---------------- Question bank (30 MCQs) ---------------- */
const QUESTIONS = [
{s:"OS Overview", q:"What is an Operating System?", o:["A software that manages hardware resources and provides services for application programs","A hardware component that speeds up the CPU","A programming language used to write applications","An application software used only for word processing"], c:0},
{s:"OS Overview", q:"Which of the following is NOT a function of an operating system?", o:["Memory management","Process management","Compiling high-level language programs into machine code","File management"], c:2},
{s:"OS Overview", q:"The operating system acts as an intermediary between:", o:["The user/application programs and the computer hardware","The user and the compiler only","Two different computers on a network","Hardware and the internet only"], c:0},
{s:"OS Overview", q:"Which of the following best describes the 'resource allocator' role of an OS?", o:["Managing and allocating conflicting requests for resources efficiently","Compiling source code into an executable","Designing graphical user interfaces","Writing device drivers exclusively"], c:0},
{s:"OS Overview", q:"An operating system is also commonly referred to as a:", o:["Compiler","Control program","Assembler","Loader"], c:1},
{s:"OS Overview", q:"Which of the following is an example of an operating system?", o:["Microsoft Word","Linux","Oracle Database","Adobe Photoshop"], c:1},
{s:"OS Overview", q:"From the user's point of view, the main purpose of an OS is to:", o:["Maximize resource utilization","Make the computer system convenient to use","Minimize hardware manufacturing cost","Increase network bandwidth"], c:1},
{s:"OS Overview", q:"Which goal is generally more important in a mainframe/server OS compared to a personal computer OS?", o:["User interface convenience","Efficient utilization of resources among multiple users","Graphics rendering speed","Battery power saving"], c:1},
{s:"Evolution of OS", q:"The earliest computers had no operating system; users interacted directly with the hardware using:", o:["Batch monitors","Machine language and plugboards","Time-sharing terminals","A graphical user interface"], c:1},
{s:"Evolution of OS", q:"In early batch processing systems, jobs with similar requirements were:", o:["Processed one at a time interactively by the user","Grouped together and processed as a batch by an operator","Distributed automatically across multiple machines","Ignored until manually re-entered each time"], c:1},
{s:"Evolution of OS", q:"Which technique allows the CPU to switch between multiple jobs held in memory so it is never idle?", o:["Multiprogramming","Batch processing alone","Spooling alone","Single tasking"], c:0},
{s:"Evolution of OS", q:"Time-sharing systems are best described as a logical extension of:", o:["Batch systems","Multiprogramming","Real-time embedded systems","Single-user standalone systems"], c:1},
{s:"Evolution of OS", q:"Which generation of computing introduced concepts like multiprogramming and spooling on a wider scale?", o:["First generation (vacuum tubes)","Second generation (transistors)","Third generation (integrated circuits)","Fourth generation (personal computers)"], c:2},
{s:"Evolution of OS", q:"In a time-sharing system, the CPU switches so rapidly among users that:", o:["Each user experiences delays of several minutes","Each user feels as though they have their own dedicated computer","Only one user can be logged in at any time","Jobs must be submitted only on punch cards"], c:1},
{s:"Evolution of OS", q:"Personal computer operating systems evolved primarily to emphasize:", o:["Maximizing CPU utilization across many simultaneous users","User convenience and responsiveness for a single user","Batch job scheduling for large organizations","Mainframe-style resource sharing"], c:1},
{s:"Computer System Organization", q:"A modern computer system consists of one or more CPUs and device controllers connected through:", o:["A common bus that provides access to shared memory","Completely separate, unconnected networks","Only serial cables with no shared memory","The operating system kernel directly, bypassing hardware"], c:0},
{s:"Computer System Organization", q:"When an I/O device finishes an operation, it typically informs the CPU by:", o:["Continuous polling by the device","Generating an interrupt","Sending a network packet","Restarting the system"], c:1},
{s:"Computer System Organization", q:"The interrupt vector is used to:", o:["Store user application data temporarily","Hold the addresses of the interrupt service routines","Store the entire operating system kernel","Manage disk partition tables"], c:1},
{s:"Computer System Organization", q:"Which storage is fastest but also most expensive and volatile in the memory hierarchy?", o:["Magnetic disk","Registers and cache memory","Optical disk","Magnetic tape"], c:1},
{s:"Computer System Organization", q:"Direct Memory Access (DMA) is used to:", o:["Allow the CPU to execute instructions faster","Transfer large blocks of data between memory and devices without CPU intervention for every byte","Increase secondary storage capacity","Encrypt data automatically during transfer"], c:1},
{s:"Computer System Organization", q:"A trap (or exception) can be described as:", o:["A hardware-generated interrupt only","A software-generated interrupt caused by an error or a user request","A type of DMA data transfer","A memory allocation technique"], c:1},
{s:"Computer System Organization", q:"Which of the following best describes the 'storage structure' in computer system organization?", o:["Only the CPU registers","The arrangement of main memory, secondary storage, and cache into a hierarchy","Only network-attached storage","The file system's directory structure"], c:1},
{s:"Computer System Organization", q:"In asymmetric multiprocessing, what happens?", o:["All processors are identical and share every task equally","Each processor is assigned a specific task, and one processor acts as the master","Only a single processor exists in the system","Processors never communicate with one another"], c:1},
{s:"OS Structure & Operations", q:"Dual-mode operation of an operating system refers to:", o:["Two different operating systems running simultaneously","User mode and kernel (supervisor) mode used to protect the OS from erroneous programs","Two CPUs working together on the same task","Running exactly two applications at the same time"], c:1},
{s:"OS Structure & Operations", q:"A system call is used by:", o:["The OS to request the manufacturing of new hardware","A user program to request a service from the operating system","The compiler to translate source code","The hardware to interrupt the CPU directly"], c:1},
{s:"OS Structure & Operations", q:"In the layered approach to operating system structure, each layer:", o:["Can access all other layers directly, regardless of order","Is built on top of lower layers and uses only the functions/services they provide","Must be written in a completely different programming language","Runs independently with no hierarchy at all"], c:1},
{s:"OS Structure & Operations", q:"The microkernel approach to OS design primarily aims to:", o:["Keep the kernel as large and feature-rich as possible","Move as much functionality as possible out of the kernel into user space","Eliminate the need for any system calls","Combine all services into a single monolithic block"], c:1},
{s:"OS Structure & Operations", q:"In a monolithic OS structure (such as the original UNIX), the kernel:", o:["Is strictly divided into independent modules with clear boundaries","Contains all operating system functionality in a single program running in kernel mode","Runs entirely in user mode","Cannot include any device drivers"], c:1},
{s:"OS Structure & Operations", q:"Virtual machines primarily provide:", o:["The illusion of a dedicated physical machine for each user, isolating them from one another","A guaranteed way to slow down system performance","Direct, unmediated access to hardware with no abstraction","Networking capability only"], c:0},
{s:"OS Structure & Operations", q:"Which of the following is a core responsibility of OS 'operations' during runtime?", o:["Handling process scheduling, memory management, and I/O management","Manufacturing computer hardware components","Designing website layouts","Managing social media accounts"], c:0},
];

const TIME_PER_Q = 30; // seconds
const TOTAL_Q = QUESTIONS.length;

/* ---------------- helpers ---------------- */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function fmtTime(s){
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
}
function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

/* ---------------- state ---------------- */
let state = {
  screen: 'register', // register, alreadyDone, ready, quiz, results
  alias: '',
  email: '',
  qOrder: [],
  optOrders: [],
  current: 0,
  answers: [],
  timeSpent: [],
  timeLeft: TIME_PER_Q,
  qStartedAt: 0,
  timerId: null,
  score: 0,
  totalTimeMs: 0,
  rank: null,
  leaderboard: [],
  saving: false,
  loadingBoard: true,
  authBusy: false,
  authError: '',
  tabSwitchCount: 0,
  myDocId: null,
  priorResult: null,
};

const app = document.getElementById('app');

function dotClass(){
  if(state.screen==='register' || state.screen==='alreadyDone') return 'on-register';
  if(state.screen==='ready') return 'on-ready';
  if(state.screen==='quiz') return 'on-running';
  return 'on-done';
}
function badgeText(){
  return {register:'idle', alreadyDone:'locked', ready:'ready', quiz:'running', results:'terminated'}[state.screen];
}
function chrome(innerHtml, titleExtra){
  return `
    <div class="window">
      <div class="titlebar">
        <div class="dots"><div class="dot ${dotClass()}"></div><div class="dot ${dotClass()}"></div><div class="dot ${dotClass()}"></div></div>
        <div class="titletext">os-quiz.sys ${titleExtra ? '— '+titleExtra : ''}</div>
        <div class="statebadge">${badgeText()}</div>
      </div>
      <div class="body">${innerHtml}</div>
    </div>`;
}

function render(){
  if(state.screen==='register') renderRegister();
  else if(state.screen==='alreadyDone') renderAlreadyDone();
  else if(state.screen==='ready') renderReady();
  else if(state.screen==='quiz') renderQuiz();
  else if(state.screen==='results') renderResults();
  checkFullscreenState();
}

const googleIcon = `<svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.6-6 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.6 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.5 0 10.4-1.9 14.3-5.1l-6.6-5.6C29.7 34.9 27 36 24 36c-5.3 0-9.7-3.4-11.3-8.1l-6.6 5.1C9.6 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.3-4.1 5.7l6.6 5.6C41.4 36 44 30.5 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>`;

function renderRegister(){
  app.innerHTML = chrome(`
    <div class="eyebrow">Process Creation</div>
    <h1>Enter the OS Quiz</h1>
    <p class="lead">30 questions, ${TIME_PER_Q}s each. Sign in with your Google account to begin — each account can take this quiz once. Options are shuffled per participant.</p>
    ${state.authError ? `<div class="errbox">${escapeHtml(state.authError)}</div>` : ''}
    <button class="btn google" id="googleBtn" ${state.authBusy ? 'disabled' : ''}>
      ${googleIcon} ${state.authBusy ? 'Signing in…' : 'Sign in with Google'}
    </button>
    <div class="pcb">
      <div><span class="k">Questions</span><span class="v">${TOTAL_Q}</span></div>
      <div><span class="k">Time / question</span><span class="v">${TIME_PER_Q}s</span></div>
      <div><span class="k">Total runtime</span><span class="v">${Math.round(TOTAL_Q*TIME_PER_Q/60)} min</span></div>
      <div><span class="k">Attempts allowed</span><span class="v">1 per Google account</span></div>
    </div>
  `);
  document.getElementById('googleBtn').onclick = doGoogleSignIn;
}

async function doGoogleSignIn(){
  state.authBusy = true;
  state.authError = '';
  render();
  try{
    const result = await signInWithPopup(auth, googleProvider);
    const user = result.user;
    state.email = user.email;
    state.alias = user.displayName || user.email.split('@')[0];
    await checkExistingAttempt();
  }catch(e){
    console.error('Sign-in failed', e);
    state.authError = 'Sign-in failed or was cancelled. Please try again.';
    state.authBusy = false;
    render();
  }
}

async function checkExistingAttempt(){
  try{
    const q = query(resultsCollectionRef, where('email', '==', state.email), limit(1));
    const snap = await getDocs(q);
    if(!snap.empty){
      const doc0 = snap.docs[0];
      state.priorResult = Object.assign({ _id: doc0.id }, doc0.data());
      state.authBusy = false;
      state.screen = 'alreadyDone';
      await loadLeaderboard();
      return;
    }
  }catch(e){
    console.error('Attempt check failed', e);
  }
  state.authBusy = false;
  state.screen = 'ready';
  render();
}

function renderAlreadyDone(){
  const r = state.priorResult;
  app.innerHTML = chrome(`
    <div class="eyebrow">State: Locked</div>
    <h1>You've already taken this quiz</h1>
    <p class="lead">Each Google account gets one attempt. Here's your recorded result, ${escapeHtml(state.alias)}.</p>
    <div class="myresult">
      <div>
        <div class="lbl">Your Score</div>
        <div class="big">${r ? r.score : '—'} / ${TOTAL_Q}</div>
      </div>
      <div style="text-align:right">
        <div class="lbl">Total Time</div>
        <div class="big" style="font-size:20px;">${r ? fmtTime(Math.round(r.totalTimeMs/1000)) : '—'}</div>
      </div>
    </div>
    <div class="section-tag">Leaderboard — Top 10</div>
    ${state.loadingBoard ? `<p class="footer-note"><span class="spin"></span>Loading leaderboard…</p>` : renderLeaderboardTable(state.leaderboard.slice(0,10))}
  `, 'locked');
}

function renderReady(){
  app.innerHTML = chrome(`
    <div class="eyebrow">State: New → Ready</div>
    <h1>You're up, ${escapeHtml(state.alias)}</h1>
    <p class="lead">Once you click start: fullscreen activates, the clock begins on question 1, and copy/paste + right-click are disabled. No pausing, no going back, no answers revealed until the end.</p>
    <button class="btn" id="beginBtn">Start Quiz</button>
    <div class="pcb">
      <div><span class="k">Signed in as</span><span class="v">${escapeHtml(state.email)}</span></div>
      <div><span class="k">Priority Queue</span><span class="v">${TOTAL_Q} jobs loaded</span></div>
    </div>
  `, 'registration');
  const beginBtn = document.getElementById('beginBtn');
  beginBtn.onclick = () => {
    state.qOrder = shuffle([...Array(TOTAL_Q).keys()]);
    state.optOrders = state.qOrder.map(qi => shuffle([...Array(QUESTIONS[qi].o.length).keys()]));
    state.answers = new Array(TOTAL_Q).fill(null);
    state.timeSpent = new Array(TOTAL_Q).fill(0);
    state.current = 0;
    state.tabSwitchCount = 0;
    requestFullscreenMode();
    state.screen = 'quiz';
    startQuestionTimer();
    render();
  };
}

function startQuestionTimer(){
  clearInterval(state.timerId);
  state.timeLeft = TIME_PER_Q;
  state.qStartedAt = Date.now();
  state.timerId = setInterval(() => {
    state.timeLeft -= 1;
    if(state.timeLeft <= 0){
      advanceQuestion();
    } else {
      updateTimerDisplay();
    }
  }, 1000);
}

function updateTimerDisplay(){
  const box = document.getElementById('timerbox');
  if(!box) return;
  box.textContent = '⏱ ' + fmtTime(state.timeLeft);
  box.classList.remove('warn','critical');
  if(state.timeLeft <= 15) box.classList.add('critical');
  else if(state.timeLeft <= 30) box.classList.add('warn');
}

function selectOption(displayIdx){
  const originalIdx = state.optOrders[state.current][displayIdx];
  state.answers[state.current] = originalIdx;
  document.querySelectorAll('.opt').forEach((el,i) => {
    el.classList.toggle('selected', i===displayIdx);
  });
}

function advanceQuestion(){
  clearInterval(state.timerId);
  const elapsed = Date.now() - state.qStartedAt;
  state.timeSpent[state.current] = elapsed;
  state.current += 1;
  if(state.current >= TOTAL_Q){
    finishQuiz();
  } else {
    startQuestionTimer();
    render();
  }
}

function renderQuiz(){
  const qi = state.qOrder[state.current];
  const question = QUESTIONS[qi];
  const orderedOpts = state.optOrders[state.current].map(idx => question.o[idx]);
  const selectedDisplayIdx = state.answers[state.current] === null ? -1 :
    state.optOrders[state.current].indexOf(state.answers[state.current]);

  app.innerHTML = chrome(`
    <div class="progresswrap">
      <span>QUESTION ${state.current+1} / ${TOTAL_Q}</span>
      <span>${escapeHtml(state.alias)}</span>
    </div>
    <div class="progressbar"><div style="width:${(state.current/TOTAL_Q)*100}%"></div></div>
    <div id="timerbox" class="timerbox">⏱ ${fmtTime(state.timeLeft)}</div>
    <div class="section-tag">${escapeHtml(question.s)}</div>
    <p class="qtext">${escapeHtml(question.q)}</p>
    <div class="options">
      ${orderedOpts.map((opt,i) => `
        <div class="opt ${i===selectedDisplayIdx?'selected':''}" data-i="${i}">
          <span class="letter">${String.fromCharCode(65+i)}</span>
          <span>${escapeHtml(opt)}</span>
        </div>`).join('')}
    </div>
    <button class="btn" id="nextBtn">${state.current === TOTAL_Q-1 ? 'Submit Quiz' : 'Next Question'}</button>
  `, 'running');

  document.querySelectorAll('.opt').forEach(el => {
    el.onclick = () => selectOption(parseInt(el.dataset.i));
  });
  document.getElementById('nextBtn').onclick = () => advanceQuestion();
  updateTimerDisplay();
}

async function finishQuiz(){
  let score = 0;
  let totalTimeMs = 0;
  for(let i=0;i<TOTAL_Q;i++){
    const qi = state.qOrder[i];
    if(state.answers[i] === QUESTIONS[qi].c) score++;
    totalTimeMs += state.timeSpent[i] || TIME_PER_Q*1000;
  }
  state.score = score;
  state.totalTimeMs = totalTimeMs;
  state.screen = 'results';
  state.saving = true;
  state.loadingBoard = true;
  render();

  const record = {
    alias: state.alias,
    email: state.email,
    score: state.score,
    totalTimeMs: state.totalTimeMs,
    tabSwitches: state.tabSwitchCount,
    submittedAt: Date.now()
  };
  try{
    const docRef = await addDoc(resultsCollectionRef, record);
    state.myDocId = docRef.id;
  }catch(e){
    console.error('Failed to save result', e);
  }
  state.saving = false;
  await loadLeaderboard();
}

async function loadLeaderboard(){
  state.loadingBoard = true;
  render();
  try{
    const snap = await getDocs(resultsCollectionRef);
    const results = [];
    snap.forEach(doc => results.push(Object.assign({ _id: doc.id }, doc.data())));
    results.sort((a,b) => b.score - a.score || a.totalTimeMs - b.totalTimeMs);
    state.leaderboard = results;
    let myIdx = results.findIndex(r => r._id === state.myDocId);
    if(myIdx === -1){
      myIdx = results.findIndex(r => r.email===state.email);
    }
    state.rank = myIdx >= 0 ? myIdx+1 : null;
  }catch(e){
    console.error('Failed to load leaderboard', e);
    state.leaderboard = [];
    state.rank = null;
  }
  state.loadingBoard = false;
  render();
}

function renderResults(){
  const top10 = state.leaderboard.slice(0,10);
  const secs = Math.round(state.totalTimeMs/1000);

  app.innerHTML = chrome(`
    <div class="eyebrow">State: Terminated</div>
    <h1>Quiz complete, ${escapeHtml(state.alias)}</h1>
    <div class="myresult">
      <div>
        <div class="lbl">Your Score</div>
        <div class="big">${state.score} / ${TOTAL_Q}</div>
      </div>
      <div style="text-align:right">
        <div class="lbl">Total Time</div>
        <div class="big" style="font-size:20px;">${fmtTime(secs)}</div>
      </div>
      <div style="text-align:right">
        <div class="lbl">Rank</div>
        <div class="big" style="font-size:20px;">${state.rank ? '#'+state.rank : '—'}</div>
      </div>
    </div>
    ${state.saving ? `<p class="footer-note"><span class="spin"></span>Saving your result…</p>` : ''}
    <div class="section-tag">Leaderboard — Top 10</div>
    ${state.loadingBoard ? `<p class="footer-note"><span class="spin"></span>Loading leaderboard…</p>` : renderLeaderboardTable(top10)}
    <button class="btn secondary" id="refreshBtn" style="margin-top:18px;">Refresh Leaderboard</button>
    <p class="footer-note">Ranked by score, then by fastest total time.</p>
  `, 'results');

  const rb = document.getElementById('refreshBtn');
  if(rb) rb.onclick = () => loadLeaderboard();
}

function renderLeaderboardTable(rows){
  if(!rows.length){
    return `<p class="footer-note">No results yet — you're the first one in.</p>`;
  }
  return `
    <table>
      <thead><tr><th>Rank</th><th>Alias</th><th>Score</th><th>Time</th><th>Flags</th></tr></thead>
      <tbody>
        ${rows.map((r,i) => `
          <tr class="${r.email===state.email ? 'me' : ''} ${i===0?'top1':''}">
            <td class="rank">${i===0?'🥇':i===1?'🥈':i===2?'🥉':('#'+(i+1))}</td>
            <td>${escapeHtml(r.alias)}</td>
            <td>${r.score}/${TOTAL_Q}</td>
            <td>${fmtTime(Math.round(r.totalTimeMs/1000))}</td>
            <td>${r.tabSwitches ? `<span class="flag">⚠ ${r.tabSwitches}</span>` : '—'}</td>
          </tr>`).join('')}
      </tbody>
    </table>`;
}

/* ---------------- fullscreen enforcement ---------------- */
function fullscreenIsSupported(){
  const el = document.documentElement;
  return !!(el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen);
}
const FULLSCREEN_SUPPORTED = fullscreenIsSupported();
function requestFullscreenMode(){
  if(!FULLSCREEN_SUPPORTED) return;
  const el = document.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
  if(req){ req.call(el).catch(() => {}); }
}
function isFullscreenActive(){
  return !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement);
}
function checkFullscreenState(){
  const warn = document.getElementById('fsWarning');
  if(!warn) return;
  // Devices without Fullscreen API support (notably iPhone Safari) can never
  // satisfy this check — skip enforcement there instead of blocking them.
  if(!FULLSCREEN_SUPPORTED){ warn.style.display = 'none'; return; }
  warn.style.display = (state.screen === 'quiz' && !isFullscreenActive()) ? 'flex' : 'none';
}
['fullscreenchange','webkitfullscreenchange','mozfullscreenchange','MSFullscreenChange'].forEach(evt => {
  document.addEventListener(evt, checkFullscreenState);
});
document.getElementById('fsResumeBtn').onclick = () => requestFullscreenMode();

/* ---------------- anti-cheat: block copy / right-click / selection during quiz ---------------- */
document.addEventListener('contextmenu', (e) => { if(state.screen==='quiz') e.preventDefault(); });
document.addEventListener('copy', (e) => { if(state.screen==='quiz') e.preventDefault(); });
document.addEventListener('cut', (e) => { if(state.screen==='quiz') e.preventDefault(); });
document.addEventListener('paste', (e) => { if(state.screen==='quiz') e.preventDefault(); });
document.addEventListener('selectstart', (e) => { if(state.screen==='quiz') e.preventDefault(); });

/* ---------------- anti-cheat: flag tab switches / minimizing during quiz ---------------- */
document.addEventListener('visibilitychange', () => {
  if(state.screen==='quiz' && document.hidden){
    state.tabSwitchCount += 1;
  }
});
window.addEventListener('blur', () => {
  if(state.screen==='quiz'){
    // debounce: visibilitychange usually already counts real tab switches;
    // this catches alt-tab to another app on some browsers.
  }
});

render();
</script>
</body>
</html>
