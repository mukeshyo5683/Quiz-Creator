<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>quiz.results</title>
<link rel="stylesheet" href="style.css">
<style>
  body{ display:flex; align-items:center; justify-content:center; padding:24px; }
  .window{ max-width: 620px; margin:0; }
  .content{ padding: 32px 34px 34px; text-align:center; }

  .headline{ font-family: var(--mono); font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.1em; margin-bottom:8px; }
  .big-score{ font-family: var(--mono); font-size:46px; color: var(--amber); margin: 4px 0 4px; }
  .sub-score{ font-family: var(--mono); font-size:13px; color:var(--muted); margin-bottom: 26px; }

  .leaderboard{ text-align:left; display:flex; flex-direction:column; gap:8px; margin-bottom: 26px; }
  .lb-row{ display:flex; align-items:center; justify-content:space-between; font-family: var(--mono); font-size:13.5px; padding:12px 14px; background: var(--panel-3); border:1px solid var(--border); border-radius:7px; }
  .lb-row .rank{ color: var(--muted); width: 26px; display:inline-block; }
  .lb-row.gold .rank{ color: var(--amber); }
  .lb-row.gold{ border-color: var(--amber-dim); }
  .lb-row .lb-score{ color: var(--teal); }

  .actions{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top: 10px; }
</style>
</head>
<body>

<div class="window">
  <div class="titlebar">
    <div class="dot r"></div><div class="dot y"></div><div class="dot g"></div>
    <div class="path"><a href="index.html">~/quiz-app</a> / results.session</div>
    <div class="badge" id="role-badge">results</div>
  </div>

  <div class="content" id="content">
    <!-- filled by script -->
  </div>
</div>

<script src="common.js"></script>
<script>
  const role = QuizApp.getParam('role', 'participant');
  const code = QuizApp.getParam('code', '------');
  const content = document.getElementById('content');

  if(role === 'host'){
    document.getElementById('role-badge').textContent = 'host summary';
    const boardRaw = QuizApp.getParam('board', '');
    const board = boardRaw
      ? boardRaw.split(',').map(pair => { const [name, score] = pair.split(':'); return { name, score: Number(score) || 0 }; })
      : [];

    content.innerHTML = `
      <div class="headline">quiz complete — room ${code}</div>
      <div class="big-score">${board.length}</div>
      <div class="sub-score">participants finished</div>
      <div class="leaderboard">
        ${board.length ? board.map((p, i) => `
          <div class="lb-row ${i === 0 ? 'gold' : ''}"><span><span class="rank">#${i+1}</span>${p.name}</span><span class="lb-score">${p.score} pts</span></div>
        `).join('') : '<div class="empty-state">No participants finished this round.</div>'}
      </div>
      <div class="actions">
        <a class="btn btn-amber" href="create-quiz.html">create_quiz --new</a>
        <a class="btn btn-ghost" href="index.html">back_to_home</a>
      </div>
    `;
  } else {
    document.getElementById('role-badge').textContent = 'your result';
    const name = QuizApp.getParam('name', 'Guest');
    const score = Number(QuizApp.getParam('score', 0));
    const total = Number(QuizApp.getParam('total', 100));
    const pct = total > 0 ? Math.round((score/total)*100) : 0;

    content.innerHTML = `
      <div class="headline">nice work, ${name}</div>
      <div class="big-score">${score}</div>
      <div class="sub-score">out of ${total} points · ${pct}% correct</div>
      <div class="leaderboard">
        <div class="lb-row gold"><span><span class="rank">#1</span>${name} (you)</span><span class="lb-score">${score} pts</span></div>
      </div>
      <div class="actions">
        <a class="btn btn-teal" href="index.html?role=participant&code=${code}">join_another --room</a>
        <a class="btn btn-ghost" href="index.html">back_to_home</a>
      </div>
    `;
  }
</script>
</body>
</html>
