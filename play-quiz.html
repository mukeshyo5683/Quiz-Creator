<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>quiz.play</title>
<link rel="stylesheet" href="style.css">
<style>
  body{ display:flex; align-items:center; justify-content:center; padding:24px; }
  .window{ max-width: 680px; margin:0; }
  .content{ padding: 30px 34px 34px; }

  .topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
  .qnum{ font-family: var(--mono); font-size:13px; color:var(--muted); }
  .timer{ font-family: var(--mono); font-size:15px; color: var(--amber); }
  .timer.low{ color: var(--red); }

  .progress-track{ height:6px; background: var(--panel-3); border:1px solid var(--border); border-radius:4px; overflow:hidden; margin-bottom:26px; }
  .progress-fill{ height:100%; background: var(--teal); width:0%; transition: width .3s ease; }

  .q-text{ font-family: var(--mono); font-size:17px; margin: 0 0 20px; line-height:1.5; }

  .opt-grid{ display:grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 22px; }
  .opt-btn{
    text-align:left; background: var(--panel-3); border:1px solid var(--border); border-radius:8px;
    padding: 14px 16px; font-family: var(--mono); font-size:13.5px; color: var(--text); cursor:pointer;
    display:flex; align-items:center; gap:10px; transition: border-color .15s ease, background .15s ease;
  }
  .opt-btn .key{ font-size:11px; color: var(--muted); border:1px solid var(--border); border-radius:4px; padding:2px 6px; flex-shrink:0; }
  .opt-btn:hover{ border-color: var(--teal); }
  .opt-btn.selected{ border-color: var(--teal); background: rgba(86,212,221,0.08); }
  .opt-btn.correct{ border-color: var(--green); background: rgba(110,231,168,0.1); }
  .opt-btn.wrong{ border-color: var(--red); background: rgba(255,107,107,0.1); }
  .opt-btn:disabled{ cursor:default; }

  .score-row{ display:flex; align-items:center; justify-content:space-between; font-family:var(--mono); font-size:12.5px; color:var(--muted); }
  .score-row b{ color: var(--amber); }
</style>
</head>
<body>

<div class="window">
  <div class="titlebar">
    <div class="dot r"></div><div class="dot y"></div><div class="dot g"></div>
    <div class="path">~/quiz-app / play-quiz.session</div>
    <div class="badge teal">room <span id="room-code-badge">------</span></div>
  </div>

  <div class="content">
    <div class="topbar">
      <span class="qnum" id="qnum-label">Question 1 of 5</span>
      <span class="timer" id="timer-label">⏱ 30s</span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>

    <div class="q-text" id="q-text">Loading question...</div>
    <div class="opt-grid" id="opt-grid"></div>

    <div class="score-row">
      <span>playing as <b id="player-name">Guest</b></span>
      <span>score: <b id="score-label">0</b></span>
    </div>

    <div class="lock-banner" id="lock-banner"><span class="dot-pulse"></span><span>Full-screen lock active — violations: <b id="violation-count">0</b></span></div>
  </div>
</div>

<script src="common.js"></script>
<script>
  const name = QuizApp.getParam('name', 'Guest');
  const code = QuizApp.getParam('code', '------');
  const anticopyOn = QuizApp.getParam('anticopy', '1') === '1';
  const quizDataRaw = QuizApp.getParam('quiz', '');
  const questions = QuizApp.decodeQuiz(quizDataRaw) || QuizApp.sampleQuiz();
  const TIMER_SECONDS = Number(QuizApp.getParam('timer', 20));

  document.getElementById('player-name').textContent = name;
  document.getElementById('room-code-badge').textContent = code;

  let currentIndex = 0;
  let score = 0;
  let countdownInterval = null;
  const keyLabels = ['A','B','C','D'];

  function log(html){ /* no visible feed on this page, but keeps initAntiCopyLock happy */ console.log(html.replace(/<[^>]+>/g,'')); }
  const antiCopy = initAntiCopyLock(log);
  if(anticopyOn) antiCopy.engage();

  function renderQuestion(){
    const q = questions[currentIndex];
    document.getElementById('qnum-label').textContent = `Question ${currentIndex + 1} of ${questions.length}`;
    document.getElementById('progress-fill').style.width = `${((currentIndex) / questions.length) * 100}%`;
    document.getElementById('q-text').textContent = q.text;

    const grid = document.getElementById('opt-grid');
    grid.innerHTML = '';
    q.options.forEach((opt, i) => {
      const btn = document.createElement('button');
      btn.className = 'opt-btn';
      btn.type = 'button';
      btn.innerHTML = `<span class="key">${keyLabels[i]}</span><span>${opt}</span>`;
      btn.addEventListener('click', () => selectOption(i));
      grid.appendChild(btn);
    });

    startTimer();
  }

  function startTimer(){
    clearInterval(countdownInterval);
    let remaining = TIMER_SECONDS;
    const timerEl = document.getElementById('timer-label');
    timerEl.textContent = `⏱ ${remaining}s`;
    timerEl.classList.remove('low');
    countdownInterval = setInterval(() => {
      remaining--;
      timerEl.textContent = `⏱ ${Math.max(remaining,0)}s`;
      if(remaining <= 5) timerEl.classList.add('low');
      if(remaining <= 0){
        clearInterval(countdownInterval);
        lockOptions(-1); // time's up, no selection
      }
    }, 1000);
  }

  function lockOptions(selectedIndex){
    clearInterval(countdownInterval);
    const q = questions[currentIndex];
    const buttons = document.querySelectorAll('.opt-btn');
    buttons.forEach((btn, i) => {
      btn.disabled = true;
      if(i === Number(q.correct)) btn.classList.add('correct');
      if(i === selectedIndex && i !== Number(q.correct)) btn.classList.add('wrong');
      if(i === selectedIndex) btn.classList.add('selected');
    });
    if(selectedIndex === Number(q.correct)){
      score += 100;
      document.getElementById('score-label').textContent = score;
    }
    setTimeout(() => {
      currentIndex++;
      if(currentIndex >= questions.length) finishQuiz();
      else renderQuestion();
    }, 1100);
  }

  function selectOption(i){
    if(document.querySelectorAll('.opt-btn')[i].disabled) return;
    lockOptions(i);
  }

  function finishQuiz(){
    if(anticopyOn) antiCopy.disengage();
    window.location.href = QuizApp.buildUrl('results.html', {
      role: 'participant', code, name, score, total: questions.length * 100
    });
  }

  renderQuestion();
</script>
</body>
</html>
